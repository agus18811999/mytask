<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifikasi Email — MyTask</title><style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:'Plus Jakarta Sans',sans-serif;color:#272337;background:radial-gradient(circle at 10% 10%,#ffd5e8,transparent 45%),#fff8fb;padding:20px}.panel{background:white;border:1px solid #ffe4ef;border-radius:28px;max-width:490px;padding:45px;box-shadow:0 24px 80px #d03b7e17;text-align:center;width:100%}.icon{font-size:40px;display:grid;place-items:center;margin:auto;background:#ffe5f1;width:90px;height:90px;border-radius:30px}h1{font-size:30px;letter-spacing:-1px}p{line-height:1.8;color:#837b89;font-size:14px}.btn{background:linear-gradient(100deg,#f33e90,#ff84b9);color:#fff;border:0;border-radius:14px;padding:15px 20px;font-weight:800;cursor:pointer;width:100%;margin:8px 0}.secondary{background:#fff1f7;color:#d83d83}button:disabled{opacity:.6}#notice{min-height:20px;font-size:13px;color:#bb3678}</style></head><body><main class="panel"><div class="icon">✉️</div><h1>One little step away.</h1><p>Kami mengirimkan tautan verifikasi ke <strong id="email">email Anda</strong>. Buka inbox (dan spam), klik tautannya, lalu kembali ke sini.</p><p id="notice" aria-live="polite"></p><button class="btn" id="check">Saya sudah verifikasi →</button><button class="btn secondary" id="resend">Kirim ulang email</button><button class="btn secondary" id="logout">Keluar dari akun</button></main><script src="config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script>(()=>{firebase.initializeApp(window.MYTASK_CONFIG.firebase);const auth=firebase.auth(),notice=document.getElementById('notice'),button=document.getElementById('check');let busy=false;auth.onAuthStateChanged(user=>{if(!user)location.replace('index.html');else{document.getElementById('email').textContent=user.email;check(true)}});async function check(silent=false){if(busy)return;busy=true;button.disabled=true;try{const u=auth.currentUser;if(!u)return;await u.reload();if(u.emailVerified){location.replace('main.html');return}if(!silent)notice.textContent='Email belum diverifikasi. Periksa tautan pada email Anda.'}catch(e){notice.textContent=e.message}finally{busy=false;button.disabled=false}}button.onclick=()=>check();document.getElementById('resend').onclick=async()=>{try{await auth.currentUser.sendEmailVerification();notice.textContent='Tautan verifikasi baru telah dikirim.'}catch(e){notice.textContent=e.message}};document.getElementById('logout').onclick=async()=>{await auth.signOut();location.replace('index.html')}})();</script></body></html>
