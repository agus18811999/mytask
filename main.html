<script src="config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script>
(()=>{'use strict';
const CFG=window.MYTASK_CONFIG,API=window.MyTaskAPI;firebase.initializeApp(CFG.firebase);const auth=firebase.auth();const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fmt=d=>{if(!d)return 'Tanpa deadline';const date=new Date(String(d).slice(0,10)+'T12:00:00');return isNaN(date)?String(d):date.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};const sameDay=d=>String(d||'').slice(0,10)===today();const fmtDateTime=d=>d?new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'—';
const NAV=[['WORKSPACE',[['overview','◈','Overview'],['tasks','✓','My Tasks'],['today','☼','Today Planner'],['kanban','▦','Kanban Board'],['calendar','▣','Calendar']]],['ORGANIZE',[['projects','◇','Projects'],['recurring','↻','Recurring Tasks'],['reminders','♧','Reminders'],['categories','◉','Categories & Tags']]],['GROWTH',[['focus','◷','Focus Mode'],['analytics','▥','Analytics'],['activity','⌁','Activity History']]],['ACCOUNT',[['archive','▤','Archive & Trash'],['profile','♙','Profile & Settings']]]];
const LABELS={overview:'Executive Overview',tasks:'My Tasks',today:'Today Planner',kanban:'Kanban Board',calendar:'Calendar & Scheduling',projects:'My Projects',recurring:'Recurring Tasks',reminders:'Deadline Intelligence',categories:'Categories & Tags',focus:'Focus & Pomodoro',analytics:'Productivity Analytics',activity:'Activity History',archive:'Archive & Trash',profile:'Profile & Settings'};
let state={module:'overview',data:{},user:null,search:'',taskStatus:'',taskPriority:'',projectFilter:'',sort:'dueDate',calendarMonth:new Date().getMonth(),calendarYear:new Date().getFullYear(),calendarView:'month',focus:{mode:'focus',remaining:1500,deadline:0,running:false,taskId:'',startedAt:null},loading:false,selectedDate:today(),filterArchive:'Tasks'};let timerHandle=null,searchHandle=null,refreshPending=null;
function collections(table,all=false){return(state.data[table]||[]).filter(x=>all||(!x.deletedAt&&!x.archived))}function tasks(){return collections('Tasks')}function projects(){return collections('Projects')}function profile(){return (state.data.Users||[])[0]||{name:state.user?.email?.split('@')[0]||'Friend'}}function preferences(){return(state.data.Preferences||[])[0]||{focusMinutes:25,shortBreak:5,longBreak:15}}function countDone(a){return a.filter(t=>t.status==='Completed').length}function overdue(t){return t.dueDate&&t.dueDate<today()&&!['Completed','Cancelled'].includes(t.status)}function completedRate(a){return a.length?Math.round(countDone(a)/a.length*100):0}function notify(text,type='success'){const node=document.createElement('div');node.className='toast '+(type==='error'?'error':'');node.textContent=text;$('toasts').append(node);setTimeout(()=>node.remove(),4500)}function setLoad(v){state.loading=v;$('loadbar').classList.toggle('hide',!v)}
function nav(){ $('nav').innerHTML=NAV.map(([group,items])=>`<div class="nav-group">${group}</div>`+items.map(([id,icon,label])=>`<button class="nav ${state.module===id?'active':''}" data-nav="${id}"><span class="symbol">${icon}</span>${label}</button>`).join('')).join('');}
function hero(eyebrow,title,desc,icon='✦'){return `<section class="hero"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="hero-side" aria-hidden="true">${esc(icon)}</div></section>`}
function empty(title='Belum ada data',hint='Tambahkan data untuk mulai mengisi ruang ini.'){return `<div class="empty"><span style="font-size:28px">✦</span><strong>${esc(title)}</strong>${esc(hint)}</div>`}
function iconButton(action,id,icon,title){return `<button class="tiny" data-action="${action}" data-id="${esc(id)}" title="${esc(title)}" aria-label="${esc(title)}">${icon}</button>`}
function taskLine(t){const done=t.status==='Completed';return `<div class="task"><input class="check" type="checkbox" data-action="complete" data-id="${esc(t.id)}" ${done?'checked':''} aria-label="Selesaikan ${esc(t.title)}"><div class="task-text"><div class="task-title ${done?'done':''}">${esc(t.title)}</div><div class="task-meta">${esc(t.status)} · ${esc(projects().find(p=>p.id===t.projectId)?.name||'Personal')} · ${fmt(t.dueDate)} ${t.dueTime?esc(t.dueTime):''}</div></div><span class="pill ${esc(t.priority||'Medium')}">${esc(t.priority||'Medium')}</span><div class="inline-actions">${iconButton('editTask',t.id,'✎','Edit task')}${iconButton('archiveTask',t.id,'▤','Arsip task')}${iconButton('deleteTask',t.id,'🗑','Hapus task')}</div></div>`}
function taskList(arr,max=999){return arr.length?arr.slice(0,max).map(taskLine).join(''):empty('Belum ada task','Mulai dengan menambahkan task pertama Anda.')}

function kpiCards(items){return `<div class="grid kpis">${items.map(k=>`<div class="card kpi"><label>${esc(k.label)}</label><div class="spark">${esc(k.icon)}</div><div class="value">${esc(k.value)}</div><div class="hint">${esc(k.hint)}</div></div>`).join('')}</div>`}
function dashboard(){const t=tasks(),due=t.filter(x=>x.dueDate&&!['Completed','Cancelled'].includes(x.status)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)),priority=t.filter(x=>x.priority==='Critical'||x.priority==='High').filter(x=>x.status!=='Completed').slice(0,5),p=profile();return hero('YOUR PRODUCTIVITY HQ',`Hello, ${p.name?.split(' ')[0]||'Friend'} ✨`,'Every task completed is progress toward something greater. Make today count.','✧')+kpiCards(metrics())+`<div class="grid two"><section class="card"><div class="section-top"><h3>Today’s priorities</h3><button class="btn" data-nav="today">View planner →</button></div>${taskList(priority.length?priority:t.filter(x=>sameDay(x.dueDate)),6)}</section><section class="card"><div class="section-top"><h3>Daily progress</h3><span class="pill">${completedRate(t)}%</span></div><div style="font-size:49px;font-weight:800;letter-spacing:-2px;margin:18px 0">${completedRate(t)}<span style="color:#f368a6">%</span></div><div class="progress"><div style="width:${completedRate(t)}%"></div></div><p class="muted" style="margin-top:17px">${countDone(t)} dari ${t.length} task selesai</p></section></div><div class="grid two"><section class="card"><div class="section-top"><h3>Upcoming deadlines</h3><button class="btn" data-nav="calendar">Calendar →</button></div>${taskList(due,6)}</section><section class="card"><div class="section-top"><h3>Recent activity</h3><button class="btn" data-nav="activity">All activity →</button></div>${activityItems(6)}</section></div>`}
function filterTasks(){let t=tasks();const q=state.search.toLowerCase();if(q)t=t.filter(x=>[x.title,x.description,x.notes,projects().find(p=>p.id===x.projectId)?.name].some(y=>String(y||'').toLowerCase().includes(q)));if(state.taskStatus)t=t.filter(x=>x.status===state.taskStatus);if(state.taskPriority)t=t.filter(x=>x.priority===state.taskPriority);if(state.projectFilter)t=t.filter(x=>x.projectId===state.projectFilter);if(state.sort==='priority'){const rank=['Critical','High','Medium','Low'];t.sort((a,b)=>rank.indexOf(a.priority)-rank.indexOf(b.priority))}else if(state.sort==='newest')t.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));else t.sort((a,b)=>String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999')));return t}
function optionList(options,selected='',placeholder='Semua'){return `<option value="">${esc(placeholder)}</option>`+options.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function tasksPage(){return hero('TASK COMMAND CENTER','Your tasks, beautifully organized.','Create, prioritize, plan and accomplish your most meaningful work.','✓')+`<div class="card"><div class="section-top"><h3>All tasks <span class="pill">${filterTasks().length}</span></h3><button class="btn primary" data-action="newTask">＋ New task</button></div><div class="toolbar"><input class="control" id="taskSearch" placeholder="Cari berdasarkan judul..." value="${esc(state.search)}"><select class="control" id="taskStatus">${optionList(['To Do','In Progress','On Hold','Completed','Cancelled'],state.taskStatus,'Semua status')}</select><select class="control" id="taskPriority">${optionList(['Critical','High','Medium','Low'],state.taskPriority,'Semua prioritas')}</select><select class="control" id="taskProject">${optionList(projects().map(p=>p.id),state.projectFilter,'Semua proyek').replace(/<option value="([^"]+)">([^<]+)<\/option>/g,(whole,id)=>`<option value="${id}">${esc(projects().find(p=>p.id===id)?.name||id)}</option>`)}</select><select class="control" id="taskSort"><option value="dueDate" ${state.sort==='dueDate'?'selected':''}>Deadline</option><option value="newest" ${state.sort==='newest'?'selected':''}>Terbaru</option><option value="priority" ${state.sort==='priority'?'selected':''}>Prioritas</option></select><button class="btn" data-action="clearFilters">Reset</button></div>${taskList(filterTasks())}</div>`}
function todayPage(){const a=tasks().filter(x=>sameDay(x.dueDate)||sameDay(x.startDate)||overdue(x)),todo=a.filter(x=>x.status!=='Completed'),done=a.filter(x=>x.status==='Completed');return hero('YOUR DAY, INTENTIONALLY DESIGNED','Today is yours.','Focus on what needs attention, carry over unfinished priorities, and close the day with clarity.','☼')+kpiCards([{label:'Due today / overdue',value:a.length,icon:'▦',hint:'Tasks in today’s plan'},{label:'Remaining',value:todo.length,icon:'◷',hint:'Open actions'},{label:'Completed',value:done.length,icon:'✓',hint:'Finished today'},{label:'Progress',value:completedRate(a)+'%',icon:'◉',hint:'Today’s completion'}])+`<div class="grid two"><div class="card"><div class="section-top"><h3>Action plan</h3><button class="btn primary" data-action="newTask">＋ Add</button></div>${taskList(todo)}</div><div class="card"><h3>Completed today</h3>${taskList(done)}</div></div>`}
const STATUS=['To Do','In Progress','On Hold','Completed'];function kanbanPage(){return hero('VISUAL WORKFLOW','Flow through your work.','Drag cards between statuses on desktop, or use Move on mobile.','▦')+`<div class="columns">${STATUS.map(s=>{const a=tasks().filter(t=>t.status===s);return `<section class="kanban-col" data-status="${s}"><h3>${s} <span class="pill">${a.length}</span></h3>${a.map(t=>`<div class="kanban-item" draggable="true" data-drag="${esc(t.id)}"><strong>${esc(t.title)}</strong><small>${fmt(t.dueDate)} · ${esc(t.priority)}</small><select aria-label="Move task status" class="control" style="width:100%;margin-top:12px" data-move="${esc(t.id)}">${STATUS.map(st=>`<option ${st===s?'selected':''}>${st}</option>`).join('')}</select></div>`).join('')||empty('No tasks')}</section>`}).join('')}</div>`}
function calendarPage(){const y=state.calendarYear,m=state.calendarMonth;const first=new Date(y,m,1),offset=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),cells=Math.ceil((offset+last)/7)*7;let days='';for(let i=0;i<cells;i++){const d=new Date(y,m,1-offset+i),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,hits=tasks().filter(t=>t.dueDate===key);days+=`<button class="day ${d.getMonth()!==m?'other':''} ${key===today()?'today':''}" data-calendar-date="${key}"><span class="number">${d.getDate()}</span><div>${hits.slice(0,4).map(()=>'<span class="dot"></span>').join('')}</div><small style="color:#df5d98">${hits.length?hits.length+' task':''}</small></button>`}const selected=tasks().filter(t=>t.dueDate===state.selectedDate);return hero('SEE THE BIGGER PICTURE','Calendar & scheduling.','Your tasks, deadlines and intentions — all in perfect view.','▣')+`<div class="grid two"><section class="card"><div class="section-top"><button class="btn" data-action="prevMonth">‹</button><h3>${first.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</h3><div class="inline-actions"><button class="btn" data-action="todayCalendar">Today</button><button class="btn" data-action="nextMonth">›</button></div></div><div class="calendar">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<div class="calendar-head">${x}</div>`).join('')}${days}</div></section><section class="card"><div class="section-top"><h3>Agenda · ${fmt(state.selectedDate)}</h3><button class="btn primary" data-action="taskOnDate">＋ Add</button></div>${taskList(selected)}</section></div>`}
function projectPage(){const list=projects();return hero('IDEAS INTO IMPACT','Projects worth pursuing.','A home for your bigger goals, milestones and connected tasks.','◇')+`<div class="section-top"><h2>My projects <span class="pill">${list.length}</span></h2><button class="btn primary" data-action="newProject">＋ New project</button></div><div class="grid three">${list.map(p=>{const a=tasks().filter(t=>t.projectId===p.id),rate=completedRate(a);return `<article class="card project" style="--project-color:${/^#[0-9a-f]{6}$/i.test(p.color)?p.color:'#ff4f9a'}"><div class="section-top"><strong>${esc(p.name)}</strong><div>${iconButton('editProject',p.id,'✎','Edit project')}${iconButton('deleteProject',p.id,'🗑','Hapus proyek')}</div></div><p class="muted">${esc(p.description||'No description yet')}</p><small>Deadline: ${fmt(p.dueDate)} · ${a.length} tasks</small><div class="progress"><div style="width:${rate}%"></div></div><small>${rate}% complete · ${esc(p.status||'Active')}</small><button class="btn" data-action="projectTasks" data-id="${esc(p.id)}">View tasks →</button></article>`}).join('')||empty('No projects yet')}</div>`}
function focusPage(){const prefs=preferences(),sessions=collections('FocusSessions'),seconds=sessions.reduce((n,x)=>n+Number(x.durationSeconds||0),0),f=state.focus;return hero('DEEP WORK STUDIO','Protect your focus.','Create space to do your best work, one intentional session at a time.','◷')+kpiCards([{label:'Total focus time',value:Math.round(seconds/60)+' min',icon:'◷',hint:'Across all recorded sessions'},{label:'Sessions',value:sessions.length,icon:'✓',hint:'Focus sessions recorded'},{label:'Today’s sessions',value:sessions.filter(x=>sameDay(x.createdAt)).length,icon:'☼',hint:'Today'},{label:'Mode',value:f.mode==='focus'?'Focus':'Break',icon:'◇',hint:'Pomodoro'}])+`<section class="card" style="text-align:center"><div class="seg" style="margin:auto"><button class="btn ${f.mode==='focus'?'active':''}" data-focus-mode="focus">Focus</button><button class="btn ${f.mode==='short'?'active':''}" data-focus-mode="short">Short break</button><button class="btn ${f.mode==='long'?'active':''}" data-focus-mode="long">Long break</button></div><div class="timer-ring" id="timerRing"><div class="timer" id="timerValue">${displayTime(f.remaining)}</div></div><div class="toolbar" style="justify-content:center"><select class="control" id="focusTask">${optionList(tasks().map(t=>t.id),f.taskId,'No linked task').replace(/<option value="([^"]+)">([^<]+)<\/option>/g,(whole,id)=>`<option value="${id}">${esc(tasks().find(t=>t.id===id)?.title||id)}</option>`)}</select></div><div class="toolbar" style="justify-content:center"><button class="btn primary" data-action="toggleFocus">${f.running?'Pause':'Start'} session</button><button class="btn" data-action="resetFocus">Reset</button><button class="btn" data-action="finishFocus">Save session</button></div></section><section class="card"><h3>Recent sessions</h3>${sessions.slice().reverse().slice(0,8).map(s=>`<div class="task"><div class="task-text"><div class="task-title">${Math.round(s.durationSeconds/60)} minute session</div><div class="task-meta">${fmtDateTime(s.endedAt)} · ${esc(tasks().find(t=>t.id===s.taskId)?.title||'Personal focus')}</div></div><span class="pill">${s.completed?'Completed':'Stopped'}</span></div>`).join('')||empty('No focus sessions yet')}</section>`}
function recurringPage(){const a=collections('RecurringRules');return hero('AUTOMATE THE ROUTINE','Make consistency effortless.','Recurring tasks help the right habits show up at the right time.','↻')+`<section class="card"><div class="section-top"><h3>Recurrence rules</h3><div class="inline-actions"><button class="btn" data-action="runRecurring">Generate due tasks</button><button class="btn primary" data-action="newRecurring">＋ New rule</button></div></div>${a.map(r=>`<div class="task"><div class="task-text"><div class="task-title">${esc(tasks().find(t=>t.id===r.taskId)?.title||'Task deleted')}</div><div class="task-meta">${esc(r.frequency)} · every ${esc(r.interval||1)} · Next ${fmt(r.nextDate)}</div></div><span class="pill">${r.active?'Active':'Stopped'}</span>${iconButton('editRecurring',r.id,'✎','Edit rule')}${iconButton('deleteRecurring',r.id,'🗑','Hapus rule')}</div>`).join('')||empty('No recurring rules')}</section>`}
function remindersPage(){const a=collections('Reminders').filter(r=>!r.read),due=tasks().filter(overdue),soon=tasks().filter(t=>t.dueDate>=today()&&t.dueDate<=offsetDate(3)&&t.status!=='Completed');return hero('NEVER MISS THE MOMENT','Deadline intelligence.','Stay one step ahead with meaningful alerts and timely reminders.','♧')+kpiCards([{label:'Overdue tasks',value:due.length,icon:'!',hint:'Past due date'},{label:'Next 3 days',value:soon.length,icon:'▦',hint:'Deadlines approaching'},{label:'Unread reminders',value:a.length,icon:'♧',hint:'Require attention'},{label:'Due today',value:tasks().filter(t=>sameDay(t.dueDate)&&t.status!=='Completed').length,icon:'☼',hint:'Priority today'}])+`<div class="grid two"><section class="card"><div class="section-top"><h3>Reminder center</h3><button class="btn primary" data-action="newReminder">＋ Reminder</button></div>${collections('Reminders').map(r=>`<div class="task"><div class="task-text"><div class="task-title">${esc(r.message||'Reminder')}</div><div class="task-meta">${fmtDateTime(r.remindAt)} · ${r.read?'Read':'Unread'}</div></div><button class="btn" data-action="readReminder" data-id="${esc(r.id)}">${r.read?'Mark unread':'Mark read'}</button>${iconButton('deleteReminder',r.id,'🗑','Delete')}</div>`).join('')||empty('No reminders')}</section><section class="card"><h3>Overdue / upcoming</h3>${taskList([...due,...soon],10)}</section></div>`}
function categoriesPage(){const cats=collections('Categories'),tags=collections('Tags');return hero('KEEP THINGS IN ORDER','Your own organization system.','Custom categories and tags make every task easier to find.','◉')+`<div class="grid two"><section class="card"><div class="section-top"><h3>Categories</h3><button class="btn primary" data-action="newCategory">＋ Category</button></div>${cats.map(c=>`<div class="task"><span style="width:12px;height:12px;border-radius:5px;background:${/^#[0-9a-f]{6}$/i.test(c.color)?c.color:'#ff4f9a'}"></span><div class="task-text"><div class="task-title">${esc(c.name)}</div></div>${iconButton('editCategory',c.id,'✎','Edit')}${iconButton('deleteCategory',c.id,'🗑','Delete')}</div>`).join('')||empty('No categories')}</section><section class="card"><div class="section-top"><h3>Tags</h3><button class="btn primary" data-action="newTag">＋ Tag</button></div>${tags.map(t=>`<div class="task"><span class="pill"># ${esc(t.name)}</span><div class="task-text"></div>${iconButton('editTag',t.id,'✎','Edit')}${iconButton('deleteTag',t.id,'🗑','Delete')}</div>`).join('')||empty('No tags')}</section></div>`}
function offsetDate(n){const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function analyticsPage(){const a=tasks(),recent=[...Array(7)].map((_,i)=>{const day=offsetDate(i-6);return {day,count:a.filter(t=>String(t.completedAt||'').slice(0,10)===day).length}}),peak=Math.max(1,...recent.map(x=>x.count)),sessions=collections('FocusSessions');const byPriority=['Critical','High','Medium','Low'].map(x=>[x,a.filter(t=>t.priority===x).length]);return hero('INSIGHTS THAT INSPIRE','Progress you can measure.','See your productivity patterns and celebrate growth backed by your real data.','▥')+kpiCards([{label:'Completion rate',value:completedRate(a)+'%',icon:'✓',hint:'All active tasks'},{label:'Overdue rate',value:(a.length?Math.round(a.filter(overdue).length/a.length*100):0)+'%',icon:'!',hint:'Needs review'},{label:'Focus time',value:Math.round(sessions.reduce((x,y)=>x+Number(y.durationSeconds||0),0)/60)+' min',icon:'◷',hint:'Cumulative'},{label:'Projects',value:projects().length,icon:'◇',hint:'Personal projects'}])+`<div class="grid two"><section class="card"><h3>Completed tasks · last 7 days</h3><div class="chart">${recent.map(x=>`<div class="barbox"><div class="bar" style="--bar:${Math.max(4,Math.round(x.count/peak*100))}%" title="${x.count} tasks"></div>${x.day.slice(5)}</div>`).join('')}</div></section><section class="card"><h3>Priority distribution</h3>${byPriority.map(([label,count])=>`<div style="margin:18px 0;font-size:12px"><div class="section-top" style="margin-bottom:8px"><strong>${label}</strong><span>${count}</span></div><div class="progress"><div style="width:${a.length?Math.round(count/a.length*100):0}%"></div></div></div>`).join('')}</section></div>`}
function activityItems(max=50){const a=collections('ActivityLogs',true).slice(0,max);return a.map(x=>`<div class="activity"><strong>${esc(x.action)} · ${esc(x.entity)}</strong><small>${fmtDateTime(x.createdAt)}</small></div>`).join('')||empty('No recorded activity')}
function activityPage(){return hero('EVERY STEP COUNTS','Your activity timeline.','A clear history of progress, changes, and milestones.','⌁')+`<div class="card"><h3>Recent events</h3>${activityItems(150)}</div>`}
function archivePage(){const table=state.filterArchive;const a=collections(table,true).filter(x=>x.archived||x.deletedAt);return hero('A PLACE FOR EVERYTHING','Archive & recovery.','Safely restore archived work or remove deleted items permanently.','▤')+`<div class="card"><div class="section-top"><h3>Archived & deleted</h3><select class="control" id="archiveTable"><option ${table==='Tasks'?'selected':''}>Tasks</option><option ${table==='Projects'?'selected':''}>Projects</option></select></div>${a.map(x=>`<div class="task"><div class="task-text"><div class="task-title">${esc(x.title||x.name)}</div><div class="task-meta">${x.deletedAt?'Trash':'Archive'} · ${fmtDateTime(x.updatedAt)}</div></div><button class="btn" data-action="restore" data-table="${table}" data-id="${esc(x.id)}">Restore</button><button class="btn danger" data-action="permanentDelete" data-table="${table}" data-id="${esc(x.id)}">Delete permanently</button></div>`).join('')||empty('Archive is empty')}</div>`}
function profilePage(){const p=profile(),pref=preferences();return hero('A SPACE THAT FEELS LIKE YOU','Personalize MyTask.','Choose the details and defaults that make your productivity experience your own.','♙')+`<div class="grid two"><section class="card"><h3>Your profile</h3><form id="profileForm"><div class="form-field"><label>Name</label><input name="name" value="${esc(p.name)}" required maxlength="100"></div><div class="form-field"><label>Email</label><input value="${esc(state.user?.email)}" disabled></div><div class="form-field"><label>Personal description</label><textarea name="description">${esc(p.description||'')}</textarea></div><button class="btn primary" type="submit">Save profile</button></form></section><section class="card"><h3>Productivity preferences</h3><form id="preferencesForm"><div class="form-field"><label>Timezone</label><input name="timezone" value="${esc(pref.timezone||'Asia/Jakarta')}" required></div><div class="form-field"><label>Default priority</label><select name="defaultPriority">${['Critical','High','Medium','Low'].map(v=>`<option ${v===pref.defaultPriority?'selected':''}>${v}</option>`).join('')}</select></div><div class="form-grid">${[['focusMinutes','Focus minutes'],['shortBreak','Short break'],['longBreak','Long break']].map(([name,label])=>`<div class="form-field"><label>${label}</label><input type="number" min="1" max="180" name="${name}" value="${Number(pref[name]||25)}"></div>`).join('')}</div><button class="btn primary" type="submit">Save preferences</button></form><hr style="border:0;border-top:1px solid #f1e5ed;margin:22px 0"><button class="btn danger" data-action="logout">Sign out</button><button class="btn" data-action="resetPassword">Send password reset email</button></section></div>`}
const screens={overview:dashboard,tasks:tasksPage,today:todayPage,kanban:kanbanPage,calendar:calendarPage,projects:projectPage,focus:focusPage,recurring:recurringPage,reminders:remindersPage,categories:categoriesPage,analytics:analyticsPage,activity:activityPage,archive:archivePage,profile:profilePage};
function render(){const fn=screens[state.module]||dashboard;$('content').innerHTML=fn();$('pageTitle').firstChild.textContent=LABELS[state.module]||'MyTask';$('dateLabel').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('sidebarName').textContent=profile().name||'MyTask User';$('sidebarEmail').textContent=state.user?.email||'';$('avatar').textContent=(profile().name||'M').slice(0,1).toUpperCase();nav();if(state.module==='focus')updateTimerUI()}
function navigate(module){state.module=module;history.replaceState(null,'','#'+module);state.search='';$('globalSearch').value='';$('sidebar').classList.remove('open');$('shade').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'})}
function refreshSoon(){clearTimeout(refreshPending);refreshPending=setTimeout(async()=>{try{const data=await API.request(auth,'snapshot');state.data=data;API.writeCache(state.user.uid,'snapshot',data);render()}catch(e){notify(e.message,'error')}},130)}
async function refresh(){if(!state.user)return;setLoad(true);try{const data=await API.request(auth,'snapshot');state.data=data;API.writeCache(state.user.uid,'snapshot',data);render();notify('Data tersinkronisasi.')}catch(e){notify(e.message,'error')}finally{setLoad(false)}}
async function mutate(operation,payload,localTable,localItem,mode){if(!state.user)return;const previous=localTable?structuredClone(state.data[localTable]||[]):null;if(localTable&&localItem){if(mode==='create')state.data[localTable]=[...(state.data[localTable]||[]),localItem];else if(mode==='update')state.data[localTable]=(state.data[localTable]||[]).map(x=>x.id===localItem.id?{...x,...localItem}:x);else if(mode==='delete')state.data[localTable]=(state.data[localTable]||[]).map(x=>x.id===localItem.id?{...x,deletedAt:today()}:x);render()}try{const result=await API.request(auth,operation,payload);if(localTable&&localItem){if(mode==='create')state.data[localTable]=state.data[localTable].map(x=>x.id===localItem.id?result:x);else if(mode==='update')state.data[localTable]=state.data[localTable].map(x=>x.id===localItem.id?result:x)}API.writeCache(state.user.uid,'snapshot',state.data);render();refreshSoon();notify('Perubahan tersimpan.');return result}catch(e){if(previous)state.data[localTable]=previous;render();notify('Gagal menyimpan: '+e.message,'error');throw e}}
function modal(title,body,onSubmit){const host=$('modalHost');host.innerHTML=`<div class="modal-overlay" id="modalOverlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="section-top"><h2 id="modalTitle">${esc(title)}</h2><button class="btn icon" id="closeModal" aria-label="Tutup">✕</button></div><form id="modalForm"><div class="form-grid">${body}</div><div class="toolbar" style="justify-content:flex-end;margin:20px 0 0"><button class="btn" type="button" id="cancelModal">Cancel</button><button class="btn primary" id="saveModal" type="submit">Save changes →</button></div></form></section></div>`;const close=()=>host.innerHTML='';$('closeModal').onclick=close;$('cancelModal').onclick=close;$('modalOverlay').onclick=e=>{if(e.target===$('modalOverlay'))close()};$('modalForm').onsubmit=async e=>{e.preventDefault();const btn=$('saveModal');btn.disabled=true;try{const data=Object.fromEntries(new FormData(e.currentTarget));await onSubmit(data);close()}catch{btn.disabled=false}};host.querySelector('input,select,textarea')?.focus();}
function field(name,label,type='text',value='',extra=''){return `<div class="form-field ${extra.includes('wide')?'wide':''}"><label for="form_${name}">${esc(label)}</label><input id="form_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(name,label,items,value='',extra=''){return `<div class="form-field ${extra}"><label for="form_${name}">${esc(label)}</label><select id="form_${name}" name="${name}">${items.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
function textField(name,label,value=''){return `<div class="form-field wide"><label>${esc(label)}</label><textarea name="${name}">${esc(value)}</textarea></div>`}
function taskForm(id=null,defaults={}){const old=id?tasks().find(x=>x.id===id):null,t=old||defaults;const html=field('title','Task title','text',t.title||'','required maxlength="150" class="wide"')+textField('description','Description',t.description)+selectField('status','Status',['To Do','In Progress','On Hold','Completed','Cancelled'].map(x=>[x,x]),t.status||'To Do')+selectField('priority','Priority',['Critical','High','Medium','Low'].map(x=>[x,x]),t.priority||preferences().defaultPriority||'Medium')+field('startDate','Start date','date',t.startDate||'')+field('dueDate','Deadline','date',t.dueDate||'')+field('dueTime','Time','time',t.dueTime||'')+selectField('projectId','Project',[['','Personal'],...projects().map(p=>[p.id,p.name])],t.projectId)+selectField('categoryId','Category',[['','None'],...collections('Categories').map(c=>[c.id,c.name])],t.categoryId)+field('tags','Tags (comma separated)','text',t.tags||'')+field('progress','Progress %','number',t.progress??0,'min="0" max="100"')+textField('notes','Notes',t.notes||'');modal(old?'Edit task':'Create task',html,async data=>{data.progress=Math.min(100,Math.max(0,Number(data.progress)||0));if(old)await mutate('update',{table:'Tasks',id:old.id,data},'Tasks',{...old,...data},'update');else await mutate('create',{table:'Tasks',data},'Tasks',{...data,id:'pending-'+Date.now(),createdAt:new Date().toISOString()},'create')})}
function projectForm(id=null){const old=projects().find(x=>x.id===id)||{},html=field('name','Project name','text',old.name||'','required maxlength="150" class="wide"')+textField('description','Description',old.description||'')+selectField('status','Status',[['Active','Active'],['Planning','Planning'],['On Hold','On Hold'],['Completed','Completed']],old.status||'Active')+selectField('priority','Priority',['Critical','High','Medium','Low'].map(x=>[x,x]),old.priority||'Medium')+field('startDate','Start','date',old.startDate||'')+field('dueDate','Deadline','date',old.dueDate||'')+field('color','Project color','color',old.color||'#ff4f9a');modal(id?'Edit project':'New project',html,async data=>{if(id)await mutate('update',{table:'Projects',id,data},'Projects',{...old,...data},'update');else await mutate('create',{table:'Projects',data},'Projects',{...data,id:'pending-'+Date.now()},'create')})}
function simpleEntityForm(table,id=null){const old=collections(table).find(x=>x.id===id)||{},name=table==='Categories'?'category':'tag';modal((id?'Edit ':'New ')+name,field('name','Name','text',old.name||'','required maxlength="100" class="wide"')+(table==='Categories'?field('color','Color','color',old.color||'#ff4f9a'):''),async data=>{if(id)await mutate('update',{table,id,data},table,{...old,...data},'update');else await mutate('create',{table,data},table,{...data,id:'pending-'+Date.now()},'create')})}
function recurringForm(id=null){const old=collections('RecurringRules').find(x=>x.id===id)||{};const html=selectField('taskId','Task',[['','Select task'],...tasks().map(x=>[x.id,x.title])],old.taskId)+selectField('frequency','Repeat',[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']],old.frequency||'daily')+field('interval','Every N intervals','number',old.interval||1,'min="1" max="365"')+field('startDate','Start date','date',old.startDate||today())+field('endDate','End date (optional)','date',old.endDate||'')+selectField('active','Active',[['true','Yes'],['false','No']],String(old.active??true));modal(id?'Edit recurrence':'New recurrence',html,async data=>{if(!data.taskId)throw notify('Pilih task terlebih dahulu.','error');data.interval=Number(data.interval);data.active=data.active==='true';if(id)await mutate('update',{table:'RecurringRules',id,data},'RecurringRules',{...old,...data},'update');else await mutate('create',{table:'RecurringRules',data},'RecurringRules',{...data,id:'pending-'+Date.now()},'create')})}
function reminderForm(){const html=selectField('taskId','Related task',[['','General reminder'],...tasks().map(t=>[t.id,t.title])])+field('message','Reminder message','text','','required maxlength="200" class="wide"')+field('remindAt','Date and time','datetime-local');modal('New reminder',html,async data=>{if(!data.remindAt)throw notify('Masukkan waktu reminder.','error');data.remindAt=new Date(data.remindAt).toISOString();await mutate('create',{table:'Reminders',data},'Reminders',{...data,id:'pending-'+Date.now(),read:false},'create')})}
function confirmAction(message,fn){modal('Confirm action',`<div class="form-field wide"><p>${esc(message)}</p></div>`,fn)}
function displayTime(sec){const n=Math.max(0,Math.ceil(sec));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function updateTimerUI(){const f=state.focus;const el=$('timerValue');if(el)el.textContent=displayTime(f.remaining);const ring=$('timerRing');if(ring){const base=Number(preferences()[f.mode==='focus'?'focusMinutes':f.mode==='short'?'shortBreak':'longBreak']||25)*60;ring.style.setProperty('--pct',`${Math.max(0,Math.min(100,100-(f.remaining/base*100)))}%`)}}
async function saveFocus(completed){const f=state.focus;if(!f.startedAt)return notify('Start a focus session first.','error');const pref=preferences(),total=Number(pref[f.mode==='focus'?'focusMinutes':f.mode==='short'?'shortBreak':'longBreak']||25)*60,spent=Math.max(1,total-f.remaining);f.running=false;try{await API.request(auth,'focusSave',{taskId:f.taskId,durationSeconds:spent,completed,startedAt:f.startedAt});notify('Focus session saved.');refreshSoon()}catch(e){notify(e.message,'error')}f.startedAt=null;f.remaining=total;render()}
function focusMode(mode){const f=state.focus;f.mode=mode;f.running=false;f.deadline=0;f.startedAt=null;const pref=preferences();f.remaining=Number(pref[mode==='focus'?'focusMinutes':mode==='short'?'shortBreak':'longBreak']||25)*60;render()}
function tick(){const f=state.focus;if(!f.running)return;f.remaining=Math.max(0,Math.ceil((f.deadline-Date.now())/1000));updateTimerUI();if(f.remaining<=0){f.running=false;saveFocus(true)}}
setInterval(tick,300);
function changeMonth(n){let d=new Date(state.calendarYear,state.calendarMonth+n,1);state.calendarYear=d.getFullYear();state.calendarMonth=d.getMonth();render()}
async function performAction(name,button){const id=button.dataset.id,table=button.dataset.table;try{switch(name){case 'newTask':taskForm();break;case 'editTask':taskForm(id);break;case 'complete':{const t=tasks().find(x=>x.id===id);if(t)await mutate('update',{table:'Tasks',id,data:{status:t.status==='Completed'?'To Do':'Completed'}},'Tasks',{...t,status:t.status==='Completed'?'To Do':'Completed'},'update');break}case 'archiveTask':{const item=tasks().find(x=>x.id===id);await API.request(auth,'delete',{table:'Tasks',id,mode:'archive'});state.data.Tasks=state.data.Tasks.map(t=>t.id===id?{...t,archived:true}:t);render();refreshSoon();notify('Task archived.');break}case 'deleteTask':case 'deleteProject':case 'deleteCategory':case 'deleteTag':case 'deleteRecurring':case 'deleteReminder':{const tbl={deleteTask:'Tasks',deleteProject:'Projects',deleteCategory:'Categories',deleteTag:'Tags',deleteRecurring:'RecurringRules',deleteReminder:'Reminders'}[name];const item=collections(tbl).find(x=>x.id===id);if(!confirm(`Pindahkan ${item?.title||item?.name||'item'} ke Trash?`))break;await mutate('delete',{table:tbl,id},tbl,item,'delete');break}case 'newProject':projectForm();break;case 'editProject':projectForm(id);break;case 'projectTasks':state.projectFilter=id;navigate('tasks');state.projectFilter=id;render();break;case 'newCategory':simpleEntityForm('Categories');break;case 'editCategory':simpleEntityForm('Categories',id);break;case 'newTag':simpleEntityForm('Tags');break;case 'editTag':simpleEntityForm('Tags',id);break;case 'newRecurring':recurringForm();break;case 'editRecurring':recurringForm(id);break;case 'runRecurring':{const r=await API.request(auth,'recurrenceRun',{});notify(`${r.created} task recurring dibuat.`);refreshSoon();break}case 'newReminder':reminderForm();break;case 'readReminder':{const r=collections('Reminders').find(x=>x.id===id);await mutate('update',{table:'Reminders',id,data:{read:!r.read}},'Reminders',{...r,read:!r.read},'update');break}case 'clearFilters':state.taskStatus='';state.taskPriority='';state.projectFilter='';state.search='';render();break;case 'prevMonth':changeMonth(-1);break;case 'nextMonth':changeMonth(1);break;case 'todayCalendar':{const d=new Date();state.calendarMonth=d.getMonth();state.calendarYear=d.getFullYear();state.selectedDate=today();render();break}case 'taskOnDate':taskForm(null,{dueDate:state.selectedDate});break;case 'toggleFocus':{const f=state.focus;if(f.running){f.remaining=Math.max(0,Math.ceil((f.deadline-Date.now())/1000));f.running=false}else{if(!f.startedAt)f.startedAt=new Date().toISOString();f.deadline=Date.now()+f.remaining*1000;f.running=true}render();break}case 'resetFocus':focusMode(state.focus.mode);break;case 'finishFocus':await saveFocus(false);break;case 'restore':await API.request(auth,'restore',{table,id});refreshSoon();notify('Item restored.');break;case 'permanentDelete':if(confirm('Permanently delete this item? This cannot be undone.')){await API.request(auth,'permanentDelete',{table,id});refreshSoon()}break;case 'logout':{API.clearCache(state.user.uid);await auth.signOut();location.replace('index.html');break}case 'resetPassword':await auth.sendPasswordResetEmail(state.user.email);notify('Password reset email sent.');break;default:break}}catch(e){notify(e.message,'error')}}
$('content').addEventListener('click',e=>{const navButton=e.target.closest('[data-nav]');if(navButton){navigate(navButton.dataset.nav);return}const day=e.target.closest('[data-calendar-date]');if(day){state.selectedDate=day.dataset.calendarDate;render();return}const mode=e.target.closest('[data-focus-mode]');if(mode){focusMode(mode.dataset.focusMode);return}const button=e.target.closest('[data-action]');if(button&&button.dataset.action!=='complete')performAction(button.dataset.action,button)});
$('content').addEventListener('change',e=>{const t=e.target;if(t.dataset.action==='complete')performAction('complete',t);if(t.dataset.move){const task=tasks().find(x=>x.id===t.dataset.move);if(task)mutate('update',{table:'Tasks',id:task.id,data:{status:t.value}},'Tasks',{...task,status:t.value},'update').catch(()=>{})}if(t.id==='taskStatus')state.taskStatus=t.value;if(t.id==='taskPriority')state.taskPriority=t.value;if(t.id==='taskProject')state.projectFilter=t.value;if(t.id==='taskSort')state.sort=t.value;if(t.id==='archiveTable')state.filterArchive=t.value;if(['taskStatus','taskPriority','taskProject','taskSort','archiveTable'].includes(t.id))render();if(t.id==='focusTask')state.focus.taskId=t.value});
$('content').addEventListener('input',e=>{if(e.target.id==='taskSearch'){clearTimeout(searchHandle);const val=e.target.value;searchHandle=setTimeout(()=>{state.search=val;render();$('taskSearch')?.focus()},230)}});
$('content').addEventListener('submit',async e=>{if(!['profileForm','preferencesForm'].includes(e.target.id))return;e.preventDefault();const form=e.target,button=form.querySelector('[type=submit]');button.disabled=true;const data=Object.fromEntries(new FormData(form));try{if(form.id==='profileForm'){const p=await API.request(auth,'profileUpdate',{data});state.data.Users=[p]}else{for(const k of ['focusMinutes','shortBreak','longBreak'])data[k]=Number(data[k]);const p=await API.request(auth,'preferencesUpdate',{data});state.data.Preferences=[p]}notify('Settings saved.');render()}catch(err){notify(err.message,'error');button.disabled=false}});
let dragId=null;$('content').addEventListener('dragstart',e=>{const node=e.target.closest('[data-drag]');if(node)dragId=node.dataset.drag});$('content').addEventListener('dragover',e=>{if(e.target.closest('.kanban-col'))e.preventDefault()});$('content').addEventListener('drop',e=>{const col=e.target.closest('.kanban-col');if(!col||!dragId)return;e.preventDefault();const task=tasks().find(x=>x.id===dragId);dragId=null;if(task&&task.status!==col.dataset.status)mutate('update',{table:'Tasks',id:task.id,data:{status:col.dataset.status}},'Tasks',{...task,status:col.dataset.status},'update').catch(()=>{})});
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)navigate(b.dataset.nav)});$('quickAdd').onclick=()=>taskForm();$('refresh').onclick=refresh;$('notificationButton').onclick=()=>navigate('reminders');$('menu').onclick=()=>{$('sidebar').classList.add('open');$('shade').classList.add('open')};$('shade').onclick=()=>{$('sidebar').classList.remove('open');$('shade').classList.remove('open')};$('globalSearch').addEventListener('input',e=>{const value=e.target.value;clearTimeout(searchHandle);searchHandle=setTimeout(()=>{if(state.module!=='tasks')navigate('tasks');state.search=value;$('globalSearch').value=value;render()},200)});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalHost').firstChild)$('modalHost').innerHTML=''});
window.addEventListener('online',()=>{notify('Back online. Syncing data...');refresh()});auth.onAuthStateChanged(async user=>{if(!user){location.replace('index.html');return}try{await user.reload();if(!user.emailVerified){location.replace('verify.html');return}state.user=user;const cache=API.readCache(user.uid,'snapshot',300000);if(cache){state.data=cache;state.module=LABELS[location.hash.slice(1)]?location.hash.slice(1):'overview';render()}setLoad(!cache);const data=await API.request(auth,'bootstrap');state.data=data;API.writeCache(user.uid,'snapshot',data);if(!cache)state.module=LABELS[location.hash.slice(1)]?location.hash.slice(1):'overview';state.focus.remaining=Number(preferences().focusMinutes||25)*60;render();}catch(err){$('content').innerHTML=hero('CONNECTION ISSUE','Could not load your workspace.','Your data is safe on the server. Check deployment settings and connection.')+`<div class="error-box">${esc(err.message)}</div><button class="btn primary" onclick="location.reload()">Retry connection</button>`;notify(err.message,'error')}finally{setLoad(false)}});
})();
</script></body></html>
